<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice 2 - Calculatrice</title>
</head>
<body>

<h2>Exercice 2 : Calculatrice Simple</h2>

<input type="number" id="num1" placeholder="Nombre 1"><br><br>
<input type="number" id="num2" placeholder="Nombre 2"><br><br>

<button onclick="calculer('+')">+</button>
<button onclick="calculer('-')">-</button>
<button onclick="calculer('*')">*</button>
<button onclick="calculer('/')">/</button>

<br><br>

<input type="text" id="resultat" placeholder="Résultat" readonly>

<script>
function calculer(operation) {
    let n1 = parseFloat(document.getElementById("num1").value);
    let n2 = parseFloat(document.getElementById("num2").value);
    let res;

    if (isNaN(n1) || isNaN(n2)) {
        alert("Veuillez entrer deux nombres !");
        return;
    }

    switch(operation) {
        case '+':
            res = n1 + n2;
            break;
        case '-':
            res = n1 - n2;
            break;
        case '*':
            res = n1 * n2;
            break;
        case '/':
            if (n2 === 0) {
                alert("Division par zéro impossible !");
                return;
            }
            res = n1 / n2;
            break;
    }

    document.getElementById("resultat").value = res;
}
</script>

</body>
</html>
