<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calculatrice Avancée</title>

<style>
body {
    background: #f0f0f0;
    font-family: Arial;
}

.calculator {
    width: 340px;
    margin: 50px auto;
    padding: 15px;
    background: #e6e6e6;
    border-radius: 8px;
    box-shadow: inset 0 0 5px #bbb;
}

#display {
    width: 100%;
    height: 60px;
    margin-bottom: 10px;
    font-size: 22px;
    text-align: right;
    padding: 10px;
    border: none;
    background: #d9d9d9;
    border-radius: 5px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
}

button {
    padding: 12px;
    font-size: 14px;
    border: none;
    border-radius: 5px;
    background: #bfbfbf;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #a6a6a6;
}

.operator {
    background: #999;
}

.equal {
    background: #666;
    color: white;
}

.clear {
    background: #888;
    color: white;
}
</style>

</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly>

    <div class="buttons">
        <!-- Ligne 1 -->
        <button onclick="add('(')">(</button>
        <button onclick="add(')')">)</button>
        <button onclick="add('%')">%</button>
        <button class="clear" onclick="clearDisplay()">CE</button>
        <button class="operator" onclick="add('/')">÷</button>

        <!-- Ligne 2 -->
        <button onclick="add('Math.sin(')">sin</button>
        <button onclick="add('Math.log(')">ln</button>
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>

        <!-- Ligne 3 -->
        <button onclick="add('Math.cos(')">cos</button>
        <button onclick="add('Math.log10(')">log</button>
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>

        <!-- Ligne 4 -->
        <button onclick="add('Math.tan(')">tan</button>
        <button onclick="add('Math.sqrt(')">√</button>
        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>

        <!-- Ligne 5 -->
        <button onclick="add('Math.exp(')">EXP</button>
        <button onclick="add('**2')">x²</button>
        <button onclick="add('.')">.</button>
        <button onclick="add('0')">0</button>
        <button class="operator" onclick="add('+')">+</button>

        <!-- Ligne 6 -->
        <button onclick="add('-')">-</button>
        <button onclick="add('*')">×</button>
        <button class="equal" onclick="calculer()">=</button>
    </div>
</div>

<script>
function add(val) {
    document.getElementById("display").value += val;
}

function calculer() {
    try {
        let expr = document.getElementById("display").value;

        // remplacer symboles visuels
        expr = expr.replace(/÷/g, "/").replace(/×/g, "*");

        let result = eval(expr);
        document.getElementById("display").value = result;
    } catch {
        alert("Erreur de calcul !");
    }
}

function clearDisplay() {
    document.getElementById("display").value = "";
}
</script>

</body>
</html>
